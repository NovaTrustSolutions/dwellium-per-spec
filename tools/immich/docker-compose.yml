# Dwellium Photo Vault — Immich on the always-on office Mac (plan 047 phase 2,
# zero-cost addendum 2026-08-20).
#
# This is the OFFICIAL Immich release compose (v3.1.0 line, fetched 2026-08-20
# from https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml)
# adapted only in ways Immich supports by configuration:
#   * volumes point at folders on the Mac disk via .env (UPLOAD_LOCATION /
#     DB_DATA_LOCATION) — copy .env.example to .env and edit it first;
#   * the immich-machine-learning container is COMMENTED OUT (optional on this
#     Apple Silicon Mac — see the note on the service below).
# The images themselves run UNMODIFIED (AGPL-3.0 rule: customize via config /
# API / Dwellium widget code only, never a fork).
#
# Setup guide: README.md next to this file.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # ── External library (optional, plan 053): index an existing photo folder
      # READ-ONLY without importing it. Uncomment (adjust the Mac path), then
      # register the container path in Immich Admin → External Libraries.
      # See README.md §External libraries + https://docs.immich.app/features/libraries/
      # - /Users/andy/OldUnitPhotos:/mnt/media/old-unit-photos:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # ── Machine learning: OPTIONAL on the office Mac (Apple Silicon) ──────────
  # Smart search + face recognition need this container. It is the heaviest
  # piece (Immich docs: 4 GB RAM machines should run with ML disabled; inside
  # Docker Desktop's VM it is CPU-only inference — the armnn/cuda/... hwaccel
  # tags do not apply). Leave it commented out to start; if Andy wants smart
  # search later, uncomment the block, run `docker compose up -d` again, and
  # re-enable ML in Immich Admin → Settings → Machine Learning Settings.
  # With it commented out, turn OFF Smart Search + Facial Recognition in that
  # same admin settings page so the server stops looking for it.
  #
  # immich-machine-learning:
  #   container_name: immich_machine_learning
  #   # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
  #   # Example tag: ${IMMICH_VERSION:-release}-cuda
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
  #   #   file: hwaccel.ml.yml
  #   #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
  #   volumes:
  #     - model-cache:/cache
  #   env_file:
  #     - .env
  #   restart: always
  #   healthcheck:
  #     disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
