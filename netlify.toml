# Netlify deploy config — Dwellium (the app lives in the qualia-shell/ subdirectory).
#
# Netlify builds a STATIC SPA: react-router.config.ts sets ssr:false when the
# NETLIFY env var is present, so `react-router build` emits a client-only bundle
# in build/client with NO server function. (The full SSR server bundle exceeds
# Netlify's Function upload limit, and this login-gated shell gains nothing from
# SSR.) Locally + in CI, SSR stays on.
#
# `base` points Netlify at the app subdir; all paths below are relative to it.

[build]
  base = "qualia-shell"
  # `git fetch --unshallow` first so the commit-count app version is accurate on
  # Netlify's shallow clone (no-ops on a complete clone).
  command = "git fetch --unshallow 2>/dev/null || true; react-router build && node scripts/write-netlify-redirects.mjs"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"
  # Vite OOMs at Netlify's default ~2 GB heap since @excalidraw/excalidraw joined
  # the bundle (047 phase 1) — build containers have 8 GB, give Node half.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Real backend is hosted on Cloud Run; keep demo seeds off for production.
  VITE_APPFOLIO_SEEDS = "false"
  # One Save sync (encrypted per-account API keys, workspaces, etc.) so they
  # persist across devices. Requires NETLIFY_API_PROXY_TARGET (set in the Netlify
  # site env) to point /api/* at the Cloud Run backend; otherwise sync is inert.
  VITE_ONE_SAVE = "true"

[dev]
  command = "react-router dev"

# scripts/write-netlify-redirects.mjs emits:
# - /api/* -> $NETLIFY_API_PROXY_TARGET/api/:splat when that env var is set.
# - /* -> /index.html for SPA deep-link refreshes.
#
# Keep this fallback here too so a manual deploy that skips the postbuild script
# still serves the client shell for deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (plan 011). The CSP ships in REPORT-ONLY mode first so it
# reports violations without blocking anything — review reports on real usage,
# then flip `Content-Security-Policy-Report-Only` -> `Content-Security-Policy`
# to enforce, and later tighten `style-src` (drop 'unsafe-inline').
#
# connect-src is the enumerated set of outbound origins the app actually calls
# (LLM providers + search + weather + Supabase), derived from
# `grep -rhoE "https://..." qualia-shell/src/lib qualia-shell/src/config.ts`,
# plus 'self' (the /api/* + /health proxy is same-origin, so the Cloud Run
# backend origin is NOT needed here). 'unsafe-inline' on style-src reflects the
# app's widespread inline styles; tightening it is a deliberate later step.
#
# Plan 043 (2026-08-16): style-src/font-src now allow Google Fonts (the app's
# body fonts) so reports are signal, not noise. Still REPORT-ONLY on purpose:
# `script-src 'self'` would block the 4 inline <script>s React Router emits into
# index.html (theme IIFE + __reactRouterContext + module import + stream close)
# — measured live via a `securitypolicyviolation` probe: `script-src-elem inline`.
# Enforcing needs per-build script hashes (or 'unsafe-inline'), plus a real
# behind-login sweep of connect-src (Sentry, api.anam.ai, …). Not done blind.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Mic/camera (TranscriptionHub, avatars) + geolocation (Sidebar weather widget) are used
    # by the app itself; no third-party origin needs them.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; media-src 'self'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.tavily.com https://api.search.brave.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Vite content-hashes its JS/CSS/wasm output under /assets/ — safe to cache forever.
# Scoped by extension on purpose: qualia-shell/public/assets/* (png/webp/mp4/jpg)
# is copied UNHASHED into the same folder and must stay revalidatable.
# index.html keeps Netlify's default max-age=0 so new deploys are picked up.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
