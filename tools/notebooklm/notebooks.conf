# tools/notebooklm/notebooks.conf — which NotebookLM notebooks mirror into the Dwellium Library (plan 052)
#
# One line per `nlm` auth profile (`nlm login --profile <name>`):
#   <profile>   <scope>
# scope = all                      → every notebook that account can see
#       = id1,id2,...              → only these notebook ids (no spaces)
# The notebook id is the first UUID in a share link:
#   https://notebook.google.com/notebook/<id>[/artifact/...]
# Blank lines and lines starting with # are ignored.
#
# profile   scope
andy        all
ilya        b35010cd-43f4-4269-8e31-07a93100c327,060d1323-4eaf-4860-911e-9e287e985124,c56e2b37-1f5f-4f55-ab4d-80779dde5125,1653a2ee-3fda-47c6-8101-24ece4d23b8c
