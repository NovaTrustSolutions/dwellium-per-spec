<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056" font-family="Hanken Grotesk, Arial, sans-serif">
  <!-- Dwellium template: Past-due rent notice — US Letter, print-friendly light.
       Georgia-appropriate NEUTRAL PLACEHOLDER wording: Georgia has no statutory
       grace period and requires a demand for possession before a dispossessory
       filing (O.C.G.A. Title 44, Ch. 7) — this template is a courtesy reminder,
       NOT that demand and NOT legal advice. Have counsel review before use. -->
  <rect width="816" height="1056" fill="#ffffff"/>

  <!-- Letterhead -->
  <rect x="48" y="48" width="10" height="44" fill="#D6FE51"/>
  <text x="74" y="74" fill="#0c0c0c" font-size="22" font-weight="800">RIVERWOOD CLUB APARTMENTS</text>
  <text x="74" y="94" fill="#777777" font-size="12">Managed by AstraStrata · example — replace with office address and phone</text>
  <line x1="48" y1="116" x2="768" y2="116" stroke="#0c0c0c" stroke-width="3"/>

  <text x="48" y="168" fill="#0c0c0c" font-size="26" font-weight="800" letter-spacing="1">NOTICE OF PAST-DUE RENT</text>
  <text x="768" y="168" fill="#999999" font-size="12" text-anchor="end">Date: ____________</text>

  <!-- Addressee -->
  <g fill="#333333" font-size="14">
    <text x="48" y="216" font-weight="700">To (resident):</text>
    <text x="160" y="216">_________________________________________ &#160;(example — replace)</text>
    <text x="48" y="244" font-weight="700">Unit:</text>
    <text x="160" y="244">Riverwood Club Apartments, Unit ______ &#160;(example — replace)</text>
  </g>
  <line x1="48" y1="268" x2="768" y2="268" stroke="#dddddd" stroke-width="1"/>

  <!-- Body -->
  <g fill="#222222" font-size="14">
    <text x="48" y="308">Our records show that rent for the premises above has not been received and is now</text>
    <text x="48" y="330">past due. Per your lease agreement, the following amounts are outstanding:</text>
  </g>

  <!-- Amounts table -->
  <g font-size="14">
    <rect x="48" y="356" width="720" height="34" fill="#0c0c0c"/>
    <text x="64" y="378" fill="#ffffff" font-weight="700">Item</text>
    <text x="600" y="378" fill="#ffffff" font-weight="700">Amount</text>
    <rect x="48" y="390" width="720" height="34" fill="#f7f7f7"/>
    <text x="64" y="412" fill="#333333">Rent for the period __________________</text>
    <text x="600" y="412" fill="#333333">$ __________</text>
    <rect x="48" y="424" width="720" height="34" fill="#ffffff"/>
    <text x="64" y="446" fill="#333333">Late fee (per lease §____)</text>
    <text x="600" y="446" fill="#333333">$ __________</text>
    <rect x="48" y="458" width="720" height="34" fill="#f7f7f7"/>
    <text x="64" y="480" fill="#333333">Other (describe) ______________________</text>
    <text x="600" y="480" fill="#333333">$ __________</text>
    <rect x="48" y="492" width="720" height="38" fill="#D6FE51"/>
    <text x="64" y="517" fill="#0c0c0c" font-weight="800">TOTAL DUE</text>
    <text x="600" y="517" fill="#0c0c0c" font-weight="800">$ __________</text>
  </g>

  <g fill="#222222" font-size="14">
    <text x="48" y="572">Please remit the total shown above within ______ days of this notice, by one of the</text>
    <text x="48" y="594">payment methods listed in your lease. If payment has already been made, please</text>
    <text x="48" y="616">contact the office so we can reconcile our records.</text>
    <text x="48" y="656">This notice is a courtesy reminder. It does not modify or waive any term of your</text>
    <text x="48" y="678">lease, and it does not waive any right or remedy available to the owner or manager</text>
    <text x="48" y="700">under the lease or under Georgia law (O.C.G.A. Title 44, Chapter 7).</text>
  </g>

  <!-- Signature -->
  <g fill="#333333" font-size="14">
    <line x1="48" y1="790" x2="330" y2="790" stroke="#333333" stroke-width="1"/>
    <text x="48" y="812">Property manager (sign)</text>
    <line x1="470" y1="790" x2="640" y2="790" stroke="#333333" stroke-width="1"/>
    <text x="470" y="812">Date</text>
  </g>

  <!-- Compliance footer -->
  <rect x="48" y="880" width="720" height="88" fill="#f4f4f4"/>
  <text x="64" y="912" fill="#666666" font-size="12" font-weight="700">TEMPLATE PLACEHOLDER — REVIEW BEFORE USE</text>
  <text x="64" y="934" fill="#777777" font-size="11">Wording is a neutral placeholder, not legal advice and not a statutory demand for</text>
  <text x="64" y="950" fill="#777777" font-size="11">possession. Have a Georgia attorney review before sending to residents.</text>

  <text x="48" y="1006" fill="#999999" font-size="10">AstraStrata · Equal Housing Opportunity</text>
  <text x="768" y="1006" fill="#bbbbbb" font-size="10" text-anchor="end">Dwellium template — late-rent-notice v1</text>
</svg>
